services:
  db:
    image: postgres:17
    container_name: student-postgres-db
    restart: unless-stopped

    environment:
      POSTGRES_USER: student_user
      POSTGRES_PASSWORD: student_password
      POSTGRES_DB: student_db
    
    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U student_user -d student_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ..
      dockerfile: postgress-infra/Dockerfile
    container_name: student-fastapi
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://student_user:student_password@db:5432/student_db
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
